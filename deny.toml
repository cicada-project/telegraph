# cargo-deny policy for the reviewed Telegraph dependency baseline.
# This config is a policy scaffold; it is not license/SBOM evidence until the
# post-handoff locked graph is audited by the T0 integration owner.

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
unlicensed = "deny"
copyleft = "deny"
allow-osi-fsf-free = "neither"
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
    { name = "libgit2-sys" },
    { name = "sqlcipher" },
    { name = "diesel" },
    { name = "sea-orm" },
    { name = "sqlx" },
    { name = "rdkafka" },
    { name = "redis" },
    { name = "ethers" },
    { name = "alloy" },
    { name = "web3" },
    { name = "tokio-tungstenite" },
    { name = "tungstenite" },
    { name = "websocket" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
