[package]
name = "telegraph-crypto"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[dependencies]
cbor4ii = { version = "=1.2.2", default-features = false, features = ["serde1"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = { version = "=0.4.3", default-features = false, features = ["sys_rng"] }
hkdf = { version = "=0.13.0", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }
thiserror = "=2.0.20"
vodozemac = { version = "=0.10.0", default-features = false }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }
