[package]
name = "telegraph-store"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "SQLite WAL persistence for opaque Telegraph relay state"

[dependencies]
getrandom = { version = "=0.4.3", default-features = false }
hmac = { version = "=0.13.0", default-features = false }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
sha2 = { version = "=0.11.0", default-features = false }
telegraph-protocol = { path = "../protocol" }
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }
zeroize = { version = "=1.9.0", default-features = false }

[dev-dependencies]
tempfile = "=3.23.0"

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_must_use = "deny"

[lints.clippy]
all = "warn"
correctness = "deny"
